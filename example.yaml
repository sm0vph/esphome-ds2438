substitutions:
  device_name: ds248x-unified-example
  friendly_name: DS248x unified example

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0

external_components:
  - source: github://sm0vph/esphome-humidity-monitor@main
    components: [ds248x_unified, vtt_mold_index]
    refresh: 0s

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
web_server:
  port: 80
  version: 3

i2c:
  sda: GPIO2  # Replace with the pins on your ESP board.
  scl: GPIO1
  frequency: 100kHz

ds248x_unified:
  - id: one_wire_hub
    address: 0x18
    active_pullup: true
    strong_pullup: true
    update_interval: 60s

    ds18b20:
      - id: external_temperature
        name: "External temperature"
        address: 0x0000000000000028

    ds2438:
      - id: humidity_module
        address: 0x0000000000000026
        humidity_model: hih4031
        humidity:
          id: crawlspace_humidity
          name: "Relative humidity"
        temperature:
          name: "DS2438 temperature"
        humidity_raw:
          name: "Uncompensated humidity"
          entity_category: diagnostic
        vad:
          name: "HIH-4031 output voltage"
          entity_category: diagnostic
        vdd:
          name: "DS2438 supply voltage"
          entity_category: diagnostic

sensor:
  # Optional, time-dependent diagnostic. It does not control any switch.
  - platform: vtt_mold_index
    name: "VTT mould index"
    temperature: external_temperature
    humidity: crawlspace_humidity
    material: very_sensitive
    update_interval: 60s
